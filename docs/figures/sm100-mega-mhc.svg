<text class="detail" x="746" y="654">BF16 and/or E4M3</text>
<text class="detail" x="746" y="679">UE8M0 scale layouts</text>
<rect x="1050" y="600" width="300" height="100" rx="12" fill="#ffe5ec" stroke="#c1cddc"/>
<text class="label" x="1066" y="629">Mix · WG4</text>
<text class="detail" x="1066" y="654">wait Mix split barrier</text>
<text class="detail" x="1066" y="679">reduce / sigmoid / Sinkhorn</text>
<text class="detail" x="1066" y="704">next pre / post / comb</text>
