<text class="detail" x="386" y="654">wait Norm split barrier</text>
<text class="detail" x="386" y="679">X1 prefetch → RMSNorm</text>
<rect x="730" y="600" width="220" height="100" rx="12" fill="#daf3e8" stroke="#c1cddc"/>
