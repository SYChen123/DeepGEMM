<style>text{font-family:Arial,sans-serif;fill:#18283e}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#53657b}.label{font-size:19px;font-weight:700}.detail{font-size:16px}.edge{fill:none;stroke:#44546b;stroke-width:2.3;marker-end:url(#arrow)}.stat{stroke-dasharray:7 5}</style>
<rect width="1400" height="800" fill="#f7f9fc"/>
<text class="title" x="50" y="50">SM100 Mega mHC · shifted</text>
<text class="sub" x="50" y="82">Persistent grid = selected SM count · 768 threads / CTA · 6 warpgroups</text>
<rect x="50" y="155" width="220" height="85" rx="12" fill="#e4efff" stroke="#c1cddc"/>
<text class="label" x="66" y="184">IO TMA · WG0/w0</text>
<text class="detail" x="66" y="209">R, X: 64 × 64 × routes</text>
<text class="detail" x="66" y="234">4 IO stages</text>
<rect x="50" y="290" width="220" height="85" rx="12" fill="#e4efff" stroke="#c1cddc"/>
<text class="label" x="66" y="319">Coeff · WG0/w3</text>
<text class="detail" x="66" y="344">post / comb / prev_pre</text>
<text class="detail" x="66" y="369">2 stages; held in registers</text>
<rect x="50" y="480" width="220" height="85" rx="12" fill="#e4efff" stroke="#c1cddc"/>
