<text class="detail" x="386" y="209">FP32 mix → BF16 boundary</text>
<text class="detail" x="386" y="234">even / odd K atoms</text>
<text class="detail" x="386" y="259">R′ and X1 square sums</text>
<rect x="730" y="155" width="220" height="85" rx="12" fill="#ece7ff" stroke="#c1cddc"/>
<text class="label" x="746" y="184">TMEM A · 4 stages</text>
<text class="detail" x="746" y="209">64 × (4 routes × K8)</text>
<text class="detail" x="746" y="234">full / empty ownership</text>
<rect x="1050" y="155" width="300" height="115" rx="12" fill="#ece7ff" stroke="#c1cddc"/>
<text class="label" x="1066" y="184">TCGEN05 · WG0/w2</text>
<text class="detail" x="1066" y="209">single warp, m64n24k8</text>
<text class="detail" x="1066" y="234">TMEM accumulator, 2 stages</text>
<text class="detail" x="1066" y="259">wait before A/Fn reuse</text>
<rect x="370" y="350" width="260" height="85" rx="12" fill="#e4efff" stroke="#c1cddc"/>
