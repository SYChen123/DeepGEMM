<text class="detail" x="386" y="404">TMA: R′ + shifted X1</text>
<text class="detail" x="386" y="429">drain, then release IO</text>
<rect x="730" y="350" width="220" height="85" rx="12" fill="#ece7ff" stroke="#c1cddc"/>
<text class="label" x="746" y="379">Fn ring · 2 stages</text>
<text class="detail" x="746" y="404">32-float TF32 atoms</text>
<text class="detail" x="746" y="429">128 B swizzle</text>
<rect x="1050" y="350" width="300" height="85" rx="12" fill="#edeff3" stroke="#c1cddc"/>
<text class="label" x="1066" y="379">Partial epilogue · WG3</text>
<text class="detail" x="1066" y="404">24 projection values / token</text>
<text class="detail" x="1066" y="429">commit + release to Mix</text>
<rect x="730" y="480" width="220" height="70" rx="12" fill="#edeff3" stroke="#c1cddc"/>
